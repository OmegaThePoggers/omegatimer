[package]
name = "omegatimer"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation_Collections", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
